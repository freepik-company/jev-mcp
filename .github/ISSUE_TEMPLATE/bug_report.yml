name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: jev-mcp version
      description: The version the server reports to your client, or the release tag / image tag you run.
      placeholder: v0.2.0
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [openrouter, typesafe]
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: Claude Desktop 1.x, Claude Code 2.x, Cursor, custom (go-sdk) ...
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options: [decide, classify, verify, rerank, list_models, start-up / configuration]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the redacted tool input and the exact error returned. Never paste API keys.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
