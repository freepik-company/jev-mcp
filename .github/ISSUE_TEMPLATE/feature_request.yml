name: Feature request
description: Propose a new tool, option or behaviour
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do with Jev through MCP that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The tool, argument or behaviour you have in mind. Example inputs and outputs help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Could this live in the MCP client, in the provider or in a workflow around the server instead?
